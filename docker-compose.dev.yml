services:
  db:
    image: postgres:17.2-alpine3.20
    container_name: sakila-facturacion-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sakila}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sakila-demo-pw-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-sakila_facturacion}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - sakila_pgdata_dev:/var/lib/postgresql/data
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sakila} -d ${POSTGRES_DB:-sakila_facturacion}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: sakila-facturacion-api-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sakila}:${POSTGRES_PASSWORD:-sakila-demo-pw-change-me}@db:5432/${POSTGRES_DB:-sakila_facturacion}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-demo-access-secret-change-me-min-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-demo-refresh-secret-change-me-min-32-chars}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:8080}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-30000}
      RUN_SEED: ${RUN_SEED:-true}
      SIAT_MODE: ${SIAT_MODE:-simulated}
      SIGNATURE_PROVIDER: ${SIGNATURE_PROVIDER:-simulated}
      SIAT_TIMEOUT_MS: ${SIAT_TIMEOUT_MS:-8000}
      SIAT_RETRIES: ${SIAT_RETRIES:-2}
      MOCK_SIAT_OUTCOME: ${MOCK_SIAT_OUTCOME:-success}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

networks:
  internal:
    internal: true

volumes:
  sakila_pgdata_dev:
